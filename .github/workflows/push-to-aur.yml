name: Push to AUR

on:
  push:
    branches:
      - main
    paths:
      - "PKGBUILD"
      - ".SRCINFO"

permissions:
  contents: read
  pull-requests: read

jobs:
  push-to-aur:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup SSH for AUR
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AUR_SSH_KEY }}" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan -t ed25519 aur.archlinux.org >> ~/.ssh/known_hosts

          cat > ~/.ssh/config <<EOF
          Host aur.archlinux.org
            IdentityFile ~/.ssh/aur
            User aur
          EOF

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Gate AUR push
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHOULD_PUSH=false

          if git tag --points-at "${{ github.sha }}" | grep -Eq '^v'; then
            SHOULD_PUSH=true
            echo "Release tag found on commit"
          else
            PR_MATCHES=$(gh api -H "Accept: application/vnd.github+json" "/repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '[.[] | select(any(.labels[]?; .name == "aur-push"))] | length')
            if [ "$PR_MATCHES" -gt 0 ]; then
              SHOULD_PUSH=true
              echo "PR with label 'aur-push' found for commit"
            fi
          fi

          echo "should_push=$SHOULD_PUSH" >> "$GITHUB_OUTPUT"

      - name: Skip AUR push
        if: steps.gate.outputs.should_push != 'true'
        run: echo "Skipping AUR push (no release tag and no PR label 'aur-push')."

      - name: Push to AUR
        if: steps.gate.outputs.should_push == 'true'
        run: |
          git clone ssh://aur@aur.archlinux.org/tomat-bin.git aur-repo
          cp PKGBUILD .SRCINFO aur-repo/
          cd aur-repo
          git add PKGBUILD .SRCINFO

          if git diff --staged --quiet; then
            echo "No changes to push"
          else
            git commit -m "Update to $(grep '^pkgver=' PKGBUILD | cut -d= -f2)"
            git push
            echo "Successfully pushed to AUR"
          fi
