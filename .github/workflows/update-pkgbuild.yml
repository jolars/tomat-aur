name: Update PKGBUILD

on:
  repository_dispatch:
    types: [new-release]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to update to (e.g., 2.9.0)"
        required: true
      pkgrel:
        description: "Package release number (default: 1)"
        required: false
        default: "1"

jobs:
  update-pkgbuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Get release info
        id: release
        run: |
          VERSION="${{ github.event.inputs.version || github.event.client_payload.version }}"
          PKGREL="${{ github.event.inputs.pkgrel || github.event.client_payload.pkgrel || '1' }}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "pkgrel=$PKGREL" >> $GITHUB_OUTPUT

          # Download binary tarballs and compute checksums
          wget "https://github.com/jolars/tomat/releases/download/v$VERSION/tomat-x86_64-unknown-linux-gnu.tar.gz"
          wget "https://github.com/jolars/tomat/releases/download/v$VERSION/tomat-aarch64-unknown-linux-gnu.tar.gz"

          SHA256_X64=$(sha256sum tomat-x86_64-unknown-linux-gnu.tar.gz | cut -d' ' -f1)
          SHA256_ARM64=$(sha256sum tomat-aarch64-unknown-linux-gnu.tar.gz | cut -d' ' -f1)

          echo "sha256_x64=$SHA256_X64" >> $GITHUB_OUTPUT
          echo "sha256_arm64=$SHA256_ARM64" >> $GITHUB_OUTPUT

          echo "Downloaded v$VERSION binaries"
          echo "SHA256 x86_64: $SHA256_X64"
          echo "SHA256 aarch64: $SHA256_ARM64"

      - name: Update PKGBUILD
        run: |
          sed -i "s/^pkgver=.*/pkgver=${{ steps.release.outputs.version }}/" PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=${{ steps.release.outputs.pkgrel }}/" PKGBUILD
          sed -i "s/^sha256sums_x86_64=.*/sha256sums_x86_64=('${{ steps.release.outputs.sha256_x64 }}')/" PKGBUILD
          sed -i "s/^sha256sums_aarch64=.*/sha256sums_aarch64=('${{ steps.release.outputs.sha256_arm64 }}')/" PKGBUILD

      - name: Test build package
        run: |
          # Extract tarballs for testing
          mkdir -p test-build
          cd test-build
          tar -xzf ../tomat-x86_64-unknown-linux-gnu.tar.gz

          # Verify expected files exist
          test -f tomat || (echo "Binary not found" && exit 1)
          test -f LICENSE || (echo "LICENSE not found" && exit 1)
          test -d man || (echo "man directory not found" && exit 1)
          test -d completions || (echo "completions directory not found" && exit 1)
          test -f tomat.service || (echo "tomat.service not found" && exit 1)

          echo "✓ All expected files present in tarball"

      - name: Install makepkg
        run: |
          sudo apt-get update
          sudo apt-get install -y pacman-package-manager

      - name: Generate .SRCINFO
        run: makepkg --printsrcinfo > .SRCINFO

      - name: Validate and build package
        uses: edlanglois/pkgbuild-action@v1

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update to v${{ steps.release.outputs.version }}"
          title: "Update to v${{ steps.release.outputs.version }}"
          body: |
            Updates PKGBUILD for tomat-bin v${{ steps.release.outputs.version }}

            **Release**: https://github.com/jolars/tomat/releases/tag/v${{ steps.release.outputs.version }}

            **Changes:**
            - pkgver: ${{ steps.release.outputs.version }}
            - pkgrel: ${{ steps.release.outputs.pkgrel }}
            - sha256sum (x86_64): `${{ steps.release.outputs.sha256_x64 }}`
            - sha256sum (aarch64): `${{ steps.release.outputs.sha256_arm64 }}`

            ---

            **Testing checklist before merging:**
            - [ ] Review PKGBUILD changes
            - [ ] Verify checksums match GitHub release
            - [ ] Will auto-push to AUR after merge
          branch: "update-v${{ steps.release.outputs.version }}"
          delete-branch: true
